# The app on Fly.io: one small machine in Tokyo.
#
# The app's name is not written here: it lives in app.json, and the
# workflows pass it as --app <name>-dan. Deploys and removal go through
# .github/workflows/, never from a session's shell.

primary_region = "nrt"   # Tokyo

[build]

[env]
  PORT = "8080"
  # Crash reporting (lib/crash.js, public/crash.js): a new app's DSN goes here; it is public by Sentry's design (https://docs.sentry.io/concepts/key-terms/dsn-explainer/).
  # Empty means no reporting: nothing is loaded and nothing is sent.
  SENTRY_DSN = ""

[http_service]
  internal_port = 8080
  force_https = true
  # Always on: a sleeping machine would cost a cold start on every look.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/alive"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
